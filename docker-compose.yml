version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: evil_mongodb
    restart: unless-stopped
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-admin}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-evil_searcher}
    volumes:
      - mongo_data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: dockerfile.backend
    container_name: evil_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      MONGO_URI: "mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD:-admin}@mongodb:27017/${MONGO_INITDB_DATABASE:-evil_searcher}?authSource=admin"
      CHROMADB_URI: "./chroma_data"
      HF_TOKEN: ${HF_TOKEN:-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}
      ZENSERP_API_KEY: ${ZENSERP_API_KEY:-15b69a40-4b14-11f1-8fd9-734ce4fa9350}
    volumes:
      - chroma_data:/app/src/chroma_data
      - w2v_model:/app/src/w2v_model
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: dockerfile.frontend
    container_name: evil_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    depends_on:
      - api

volumes:
  mongo_data:
  chroma_data:
  w2v_model: